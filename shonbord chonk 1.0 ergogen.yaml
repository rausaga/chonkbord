meta:
  engine: 4.1.0
units:
  # MX with extra clearance for keycaps (19.05mm)
  kx: U
  ky: U
  hkx: kx/2
  hky: ky/2
  #padding
  px: kx+2
  py: ky+2
  hpx: px/2
  hpy: py/2
  screwSize: 1.5
  standoffSize: 2.5
points:
  zones:
    matrixlh:
      key:
        padding: 1ky 
        spread: 1kx 
      anchor:
        rotate: 0
        shift: [100, -100]
      columns:
        c0:
          key:
            column_net: P21
          rows:
            r4:
              shift: [-0.25kx, 0]
            r3:
              skip: true
            r2:
              shift: [-0.5kx, 0]
            r1:
              shift: [0.25kx, 0]
            r0:
              shift: [0.25kx, 0]
        c1:
          key:
            column_net: P20
          rows:
            r4:
              shift: [-0.125kx, 0]
            r3:
              shift: [-0.5kx, 0]
            r2:
              shift: [0.25kx, 0]
            r1:
              shift: [0.125kx, 0]
            r0:
              shift: [0.25kx, 0]
        c2:
          key:
            column_net: P19
          rows:
            r4:
              shift: [0.125kx, 0]
            r3:
              shift: [-0.125kx, 0]
            r2:
            r1:
            r0:
        c3:
          key:
            column_net: P18
          rows:
            r4:
              shift: [0.375kx, 0]
            r3:
              shift: [-0.375kx, 0]
            r2:
            r1:
            r0:
        c4:
          key:
            column_net: P15
          rows:
            r4:
              skip: true
            r3:
            r2:
            r1:
            r0:
        c5:
          key:
            column_net: P14
          rows:
            r4:
              shift: [-0.375kx, 0]
            r3:
              shift: [0.375kx, 0]
            r2:
            r1:
            r0:
        c6:
          key:
            column_net: P16
          rows:
            r4:
              shift: [-0.125kx, 0]
            r3:
              shift: [0.125kx, 0]
            r2:
            r1:
            r0:
        c7:
          key:
            column_net: P10
          rows:
            r4:
              shift: [0kx, 1hky]
            r3:
              skip: true
            r2:
              skip: true
            r1:
              skip: true
            r0:
              skip: true

      rows:
        r4:
          row_net: P6
        r3:
          row_net: P5
        r2:
          row_net: P4
        r1:
          row_net: P3
        r0:
          row_net: P2
    

outlines:
  mxswitches:
    - what: rectangle
      where: true
      size: [13.9,13.9]
  pathoutline:
    - what: path
      segments: 

        - type: line
          points:
          - ref: matrixlh_c0_r0
            shift: [-hpx ,hpy]
          - ref: matrixlh_c1_r0
            shift: [hpx ,hpy]
          - ref: matrixlh_c6_r0
            shift: [hpx ,hpy]
          - ref: matrixlh_c6_r0
            shift: [hpx ,0]
          - ref: matrixlh_c6_r0
            shift: [30 ,0]
          - ref: matrixlh_c6_r3
            shift: [30 ,-3hpy+2]
          - ref: matrixlh_c0_r4
            shift: [-hpx ,-hpy]
          - ref: matrixlh_c0_r4
            shift: [-hpx ,hpy]
          - ref: matrixlh_c0_r2
            shift: [-1 ,-hpy]
          - ref: matrixlh_c0_r2
            shift: [-hpx ,-hpy]
          - ref: matrixlh_c0_r2
            shift: [-hpx ,hpy]
          - ref: matrixlh_c0_r1
            shift: [-hpx ,-hpy+2]
          - ref: matrixlh_c0_r1
            shift: [-hpx ,hpy]
          - ref: matrixlh_c0_r0
            shift: [-hpx ,-hpy+2]
      fillet: 1
  mxswitchplate:
    - name: pathoutline
    - operation: subtract
      name: mxswitches
      origin: 
pcbs:
  chonkbord:
    template: kicad8
    outlines:
      main:
        outline: pathoutline
    footprints:
      mx_hotswap:
        what: ceoloide/switch_mx
        where: true
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          include_corner_marks: true
          include_keycap: true
          keycap_height: 19.05
          keycap_width: 19.05
          reversible: true
          solder: false
          hotswap: true
          outer_pad_width_front: 2.0
          outer_pad_width_back: 2.0
      diodes:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          reversible: true
          include_tht: true
        adjust:
          shift: [0, -5]
      mcu:
        what: ceoloide/mcu_nice_nano
        params:
          reversible: true
          reverse_mount: true
          only_required_jumpers: false
          include_extra_pins: false
        where:
          ref: matrixlh_c6_r1
          shift: [19.75,2.5]
          rotate: 0
      reset_button:
        what: ceoloide/reset_switch_tht_top
        params:
          reversible: true
        where:
          ref: matrixlh_c6_r1
          shift: [28, -20]
          rotate: 270
      side_on_off_switch:
        what: ceoloide/power_switch_smd_side
        where: matrixlh_c6_r2
        params:
          from: BAT_P
          to: RAW
          reversible: true
        adjust:
          shift: [28.125, -12]
          rotate: 0
      battery_connector:
        what: ceoloide/battery_connector_jst_ph_2
        where: matrixlh_c6_r2
        params:
          reversible: true
        adjust:
          shift: [19.75, -10]
          rotate: 180 
      m2_screw_topleft:
        what: ceoloide/mounting_hole_npth
        where: 
          ref: matrixlh_c0_r1
        adjust:
          shift: [16.625,12]
        params:
          hole_size: 4.6
          hole_drill: 2.2
      m2_screw_botleft:
        what: ceoloide/mounting_hole_npth
        where: 
          ref: matrixlh_c2_r3
        adjust:
          shift: [-hkx,-12.5]
        params:
          hole_size: 4.6
          hole_drill: 2.2
      m2_screw_topright:
        what: ceoloide/mounting_hole_npth
        where: 
          ref: matrixlh_c5_r1
        adjust:
          shift: [9.5,9.5]
        params:
          hole_size: 4.6
          hole_drill: 2.2
      m2_screw_botright:
        what: ceoloide/mounting_hole_npth
        where: 
          ref: matrixlh_c5_r3
        adjust:
          shift: [4.75,-12.5]
        params:
          hole_size: 4.6
          hole_drill: 2.2
      m2_screw_undermcu:
        what: ceoloide/mounting_hole_npth
        where: 
          ref: matrixlh_c6_r2
        adjust:
          shift: [12,0]
        params:
          hole_size: 4.6
          hole_drill: 2.2
